<title>코스믹 도감</title>
<style>
:root{--bg:#070B1E;--panel:#121838;--line:rgba(255,255,255,.08);--txt:#EEF1FF;--sub:#8F98C8;
  --t0:#9AA1B2;--t1:#3DDC84;--t2:#4C9DFF;--t3:#B26BFF;--t4:#FFC83D;--accent:#FF6B4A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}html{scrollbar-width:none}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 70% at 50% 0%,#1B2459 0%,#0B1030 45%,#070B1E 100%)}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:18px 18px 150px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding-top:env(safe-area-inset-top)}
header b{font-size:23px;font-weight:900;letter-spacing:-.04em}
header b em{font-style:normal;color:var(--t4)}
.pill{background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--sub)}
.pill b{color:var(--txt)}
section{display:none}section.on{display:block}

/* observe */
.portal{position:relative;margin:22px auto 0;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.portal .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(143,152,200,.35);animation:spin 30s linear infinite}
.portal .ring2{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(76,157,255,.22),rgba(178,107,255,.10) 55%,transparent 70%);box-shadow:0 0 60px rgba(76,157,255,.25)}
.portal .core{position:relative;text-align:center}
.portal .core b{display:block;font-size:20px;font-weight:900}
.portal .core span{font-size:12.5px;color:var(--sub);font-weight:700}
.portal.shake{animation:wob .45s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg) scale(1.03)}}
.charges{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}
.charges i{width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.charges i.on{background:linear-gradient(180deg,#7FB8FF,#4C9DFF);border-color:transparent;box-shadow:0 0 10px rgba(76,157,255,.6)}
.chargeTxt{text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.chargeTxt b{color:var(--txt)}
.engine{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.engBtn{width:92px;height:92px;border-radius:26px;border:0;background:linear-gradient(180deg,#FF8A5B,#FF5A3C);box-shadow:0 6px 0 #B83A22;display:grid;place-items:center;cursor:pointer}
.engBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #B83A22}
.engBtn svg{width:50px;height:50px}
.eng b{font-size:15px;font-weight:900}
.eng span{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:2px}
.gauge{height:12px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC83D,#FF6B4A)}
.corner{position:fixed;right:max(16px,calc(50% - 204px));bottom:104px;z-index:6;display:none;flex-direction:column;gap:8px;align-items:flex-end}
.corner.on{display:flex}
.tog{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(18,24,56,.92);backdrop-filter:blur(10px);color:var(--sub);border-radius:999px;padding:8px 12px 8px 10px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.tog i{width:26px;height:16px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.tog i:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#8F98C8;transition:.2s}
.tog.on{color:var(--txt);border-color:rgba(76,157,255,.6)}
.tog.on i{background:#4C9DFF}.tog.on i:after{left:12px;background:#fff}

/* dex */
.dexTop{display:flex;justify-content:space-between;align-items:flex-end;margin:20px 2px 12px}
.dexTop b{font-size:18px;font-weight:900}
.dexTop span{font-size:12.5px;color:var(--sub);font-weight:700}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3DDC84,#4C9DFF,#B26BFF,#FFC83D)}
.tierH{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:13px;font-weight:900}
.tierH i{width:10px;height:10px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:3/4;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;cursor:pointer;overflow:hidden}
.slot svg{width:62%;height:auto}
.slot small{font-size:10px;font-weight:800;text-align:center;line-height:1.15;padding:0 4px}
.slot em{position:absolute;top:5px;right:6px;font-style:normal;font-size:10px;font-weight:900;color:var(--sub)}
.slot.unknown{opacity:.45}.slot.unknown b{font-size:22px;color:var(--sub)}

/* fusion */
.fuseIntro{margin:20px 2px 14px}
.fuseIntro b{font-size:18px;font-weight:900}
.fuseIntro p{font-size:12.5px;color:var(--sub);font-weight:700;margin-top:4px;line-height:1.5}
.fuse{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.fuse .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#0B1030}
.fuse b{font-size:14px;font-weight:900}
.fuse span{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-top:2px}
.fuse button{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-size:13px;font-weight:900;color:#0B1030;background:var(--t4);cursor:pointer}
.fuse button:disabled{background:rgba(255,255,255,.08);color:var(--sub)}

/* tab bar */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:5;display:flex;gap:4px;background:rgba(18,24,56,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom)/2)}
nav button{white-space:nowrap;min-width:84px;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13px;font-weight:900;padding:10px 20px;border-radius:16px;cursor:pointer}
nav button.on{background:#EEF1FF;color:#0B1030}

/* reveal */
.reveal{position:fixed;inset:0;z-index:10;background:rgba(4,6,18,.86);display:none;place-items:center}
.reveal.on{display:grid}
.rcard{width:240px;border-radius:24px;padding:20px 18px 18px;text-align:center;background:linear-gradient(180deg,#1A2150,#0E1334);border:2px solid;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4) rotateY(90deg);opacity:0}to{transform:scale(1) rotateY(0);opacity:1}}
.rcard .tag{display:inline-block;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;color:#0B1030}
.rcard .new{margin-left:6px;background:var(--accent);color:#fff}
.rcard svg{width:150px;height:150px;margin:12px 0 6px}
.rcard b{display:block;font-size:22px;font-weight:900;letter-spacing:-.03em}
.rcard p{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5;font-weight:600}
.reveal .ok{margin-top:16px;border:0;border-radius:14px;padding:12px 26px;font:inherit;font-weight:900;background:#EEF1FF;color:#0B1030}
.legend .rcard{box-shadow:0 0 0 6px rgba(255,200,61,.15),0 0 80px rgba(255,200,61,.55)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,40px);opacity:0;background:#EEF1FF;color:#0B1030;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:800;transition:.3s;z-index:9;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-height:760px){
  .portal{width:190px;height:190px;margin-top:10px}
  .portal .ring2{inset:16px}
  .charges{margin-top:12px}
  .engine{margin-top:12px;grid-template-columns:80px 1fr;padding:12px}
  .engBtn{width:80px;height:80px;border-radius:22px}
}
</style>
</head>
<body>
<div id="sky"></div>
<div class="app">
  <header><b>코스믹 <em>도감</em></b><div class="pill">수집 <b id="foundN">0</b> / <span id="totalN"></span></div></header>

  <section id="tab-obs" class="on">
    <div class="portal" id="portal"><div class="ring"></div><div class="ring2"></div>
      <div class="core"><b>흔들어서 관측</b><span id="hint"></span></div></div>

  <section id="tab-fuse">

    <div id="fuse"></div>
  </section>
</div>

<div class="corner on" id="corner"><button class="tog" id="touchTog"><i></i>터치 관측</button><button class="tog" id="shakeTog"><i></i>흔들기 켜기</button></div>

<div class="reveal" id="reveal"><div style="text-align:center"><div id="rcard"></div><button class="ok" id="ok">확인</button></div></div>
<div class="toast" id="toast"></div>

 ['cmb','우주 배경 복사',4,'cmb','#FF8A5B','#4C9DFF','빅뱅의 흔적으로 우주 전체에 남아 있는 빛이에요.'],
 ['bigbang','빅뱅',4,'bigbang','#FFFFFF','#FFC83D','우주의 시작. 레전드 카드 3장을 융합해야만 만날 수 있어요.']
].map(([id,name,tier,shape,c1,c2,desc,extra]) => ({id,name,tier,shape,c1,c2,desc,extra}));
const HIDDEN = 'bigbang';
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));

const KEY = 'cosmic-dex-v1';
const MAX = 10;
function fresh(){ return {charges: MAX, inv:{}, found:[]}; }
let S; try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

// ---------- 카드 그림 ----------
let uid = 0;
function art(c, size=100){
  const u = 'g'+(uid++); const C=50, R=30; let s='';
  const glow = `<radialGradient id="${u}l" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="${c.c1}"/><stop offset="1" stop-color="${c.c2}"/></radialGradient>`;
  const soft = `<radialGradient id="${u}s"><stop offset="0" stop-color="${c.c1}" stop-opacity=".95"/><stop offset=".45" stop-color="${c.c2}" stop-opacity=".5"/><stop offset="1" stop-color="${c.c2}" stop-opacity="0"/></radialGradient>`;
  const defs = `<defs>${glow}${soft}<clipPath id="${u}c"><circle cx="50" cy="50" r="${R}"/></clipPath></defs>`;
  switch(c.shape){
    case 'planet':
      s += `<circle cx="50" cy="50" r="${R}" fill="url(#${u}l)"/>`;
      s += `<g clip-path="url(#${u}c)" opacity=".35">${[0,1,2,3].map(i=>`<rect x="10" y="${30+i*11}" width="80" height="4" fill="${c.c2}"/>`).join('')}</g>`;
      if (c.extra==='spot') s += `<ellipse cx="60" cy="58" rx="7" ry="4" fill="#B5462B"/>`;
      if (c.extra==='ring') s = `<ellipse cx="50" cy="50" rx="46" ry="11" fill="none" stroke="${c.c1}" stroke-width="5" opacity=".9"/>` + s + `<path d="M4 50 a46 11 0 0 0 92 0" fill="none" stroke="${c.c1}" stroke-width="5"/>`;
      if (c.extra==='vring') s += `<ellipse cx="50" cy="50" rx="10" ry="44" fill="none" stroke="#E6FBFF" stroke-width="2" opacity=".7"/>`;
      break;
    case 'earth':
      s += `<circle cx="50" cy="50" r="${R}" fill="#2F6FD0"/><g clip-path="url(#${u}c)"><path d="M28 34c8-6 18-2 20 6s-8 8-6 16-10 6-14-2-6-14 0-20zM58 56c6-4 16-2 18 6s-6 14-14 12-10-12-4-18z" fill="#3DDC84"/><path d="M20 40c20-8 40-4 62 2" stroke="#fff" stroke-width="3" opacity=".6" fill="none"/></g>`;
      break;
    case 'rock':
      s += `<path d="M24 48c0-14 10-24 24-26s30 8 30 22-6 28-24 30-30-10-30-26z" fill="url(#${u}l)"/>`;
      s += [[40,40,5],[58,56,7],[44,62,4],[62,38,3]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.c2}" opacity=".6"/>`).join('');
      break;
    case 'meteor':
      s += [[20,22],[46,14],[30,48],[60,40],[44,72]].map(([x,y])=>`<path d="M${x} ${y} l26 18" stroke="${c.c2}" stroke-width="2.5" stroke-linecap="round" opacity=".6"/><circle cx="${x+26}" cy="${y+18}" r="3" fill="${c.c1}"/>`).join('');
      break;
    case 'dust':
      for (let i=0;i<46;i++){ const a=i*2.4, r=4+i*0.75; s+=`<circle cx="${50+Math.cos(a)*r}" cy="${50+Math.sin(a)*r*.7}" r="${1+(i%3)*.6}" fill="${i%2?c.c1:c.c2}" opacity="${.4+(i%4)*.15}"/>`; }
      break;
    case 'belt':
      s += `<circle cx="50" cy="50" r="6" fill="#FFD54A"/>`;
      for (let i=0;i<40;i++){ const a=i/40*Math.PI*2; s+=`<circle cx="${50+Math.cos(a)*36}" cy="${50+Math.sin(a)*14}" r="${1.4+(i%3)*.7}" fill="${c.c1}"/>`; }
      break;
    case 'cloud':
      s += `<circle cx="50" cy="50" r="5" fill="#FFD54A"/>`;
      for (let i=0;i<70;i++){ const a=i*2.39, r=30+(i%5)*3.5; s+=`<circle cx="${50+Math.cos(a)*r}" cy="${50+Math.sin(a)*r}" r="1.3" fill="${c.c1}" opacity=".7"/>`; }
      break;
    case 'comet':
      s += `<path d="M64 36 L14 78 L22 84 Z" fill="${c.c2}" opacity=".35"/><path d="M64 36 L20 70 L30 80 Z" fill="${c.c1}" opacity=".5"/><circle cx="64" cy="36" r="10" fill="url(#${u}s)"/><circle cx="64" cy="36" r="5" fill="#fff"/>`;
      break;
    case 'star':
      s += `<circle cx="50" cy="50" r="44" fill="url(#${u}s)"/><circle cx="50" cy="50" r="18" fill="url(#${u}l)"/>`;
      s += [0,45,90,135].map(a=>`<rect x="48.5" y="10" width="3" height="80" rx="1.5" fill="${c.c1}" opacity=".55" transform="rotate(${a} 50 50)"/>`).join('');
      break;
    case 'giant':
      s += `<circle cx="50" cy="50" r="46" fill="url(#${u}s)"/><circle cx="50" cy="50" r="33" fill="url(#${u}l)"/><circle cx="40" cy="42" r="8" fill="#fff" opacity=".12"/>`;
      break;
    case 'dwarfstar':
      s += `<circle cx="50" cy="50" r="40" fill="url(#${u}s)"/><circle cx="50" cy="50" r="8" fill="#fff"/>` + [0,60,120].map(a=>`<rect x="49" y="18" width="2" height="64" rx="1" fill="#fff" opacity=".7" transform="rotate(${a} 50 50)"/>`).join('');
      break;
    case 'neutron':
      s += `<path d="M50 50 L36 2 L64 2 Z" fill="${c.c2}" opacity=".45"/><path d="M50 50 L36 98 L64 98 Z" fill="${c.c2}" opacity=".45"/><circle cx="50" cy="50" r="16" fill="url(#${u}s)"/><circle cx="50" cy="50" r="7" fill="#fff"/>`;
      break;
    case 'supernova':
      for (let i=0;i<16;i++){ s+=`<path d="M50 50 L${50+Math.cos(i/16*6.283)*(i%2?44:30)} ${50+Math.sin(i/16*6.283)*(i%2?44:30)}" stroke="${i%2?c.c2:c.c1}" stroke-width="${i%2?3:5}" stroke-linecap="round"/>`; }
      s += `<circle cx="50" cy="50" r="16" fill="${c.c1}"/><circle cx="50" cy="50" r="8" fill="#fff"/>`;
      break;
    case 'cluster':
      [[50,50,5],[36,40,4],[62,36,4],[40,64,3.5],[66,60,4.5],[52,28,3],[28,56,3],[74,46,3]].forEach(([x,y,r])=>{ s+=`<circle cx="${x}" cy="${y}" r="${r*2.6}" fill="url(#${u}s)" opacity=".7"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`; });
      break;
    case 'nebula':
      [[40,42,26,c.c1],[60,56,28,c.c2],[52,36,18,c.c2],[38,62,18,c.c1]].forEach(([x,y,r,col])=>{ s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity=".35"/>`; });
      s += [[30,30],[70,40],[50,70],[64,24]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.6" fill="#fff"/>`).join('');
      break;
    case 'galaxy':
      for (let k=0;k<2;k++) for (let i=0;i<34;i++){ const a=i*0.28+k*Math.PI, r=4+i*1.25; s+=`<circle cx="${50+Math.cos(a)*r}" cy="${50+Math.sin(a)*r*.55}" r="${2.6-i*0.05}" fill="${i%3?c.c1:c.c2}" opacity="${1-i/40}"/>`; }
      s += `<ellipse cx="50" cy="50" rx="9" ry="6" fill="#fff"/>`;
      break;
    case 'irregular':
      for (let i=0;i<60;i++){ const x=50+Math.sin(i*1.7)*30*Math.cos(i), y=50+Math.cos(i*2.3)*18; s+=`<circle cx="${x}" cy="${y}" r="${1.2+(i%4)*.6}" fill="${i%2?c.c1:c.c2}" opacity=".75"/>`; }
      break;
    case 'pillars':
      s += `<rect x="0" y="0" width="100" height="100" fill="${c.c2}" opacity=".25"/>`;
      s += `<path d="M22 100 C20 70 26 50 24 32 C28 26 34 30 33 38 C34 60 36 80 38 100Z" fill="${c.c1}"/><path d="M48 100 C47 80 50 62 49 50 C53 45 58 49 57 56 C58 72 60 88 61 100Z" fill="${c.c1}" opacity=".9"/><path d="M70 100 C70 86 72 76 71 68 C74 64 78 67 77 72 C78 84 80 92 81 100Z" fill="${c.c1}" opacity=".8"/>`;
      break;
    case 'ringneb':
      s += `<circle cx="50" cy="50" r="30" fill="none" stroke="${c.c2}" stroke-width="12" opacity=".65"/><circle cx="50" cy="50" r="22" fill="${c.c1}" opacity=".35"/><circle cx="50" cy="50" r="3" fill="#fff"/>`;
      break;
    case 'blackhole':
      s += `<ellipse cx="50" cy="50" rx="46" ry="14" fill="none" stroke="${c.c1}" stroke-width="7" opacity=".9"/><circle cx="50" cy="50" r="24" fill="none" stroke="${c.c2}" stroke-width="5" opacity=".9"/><circle cx="50" cy="50" r="20" fill="#000"/><path d="M4 50 a46 14 0 0 0 92 0" fill="none" stroke="${c.c1}" stroke-width="7"/>`;
      break;
    case 'constellation':
      { const p=[[22,70],[34,54],[50,58],[62,42],[76,30],[60,24],[50,58]]; s+=`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${c.c1}" stroke-width="1.5" opacity=".6"/>`; s+=p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#fff"/>`).join(''); s+=`<circle cx="66" cy="72" r="10" fill="url(#${u}s)"/><circle cx="66" cy="72" r="4" fill="#000" stroke="${c.c2}" stroke-width="1.5"/>`; }
      break;
    case 'quasar':
      s += `<path d="M50 50 L42 0 L58 0Z" fill="${c.c1}" opacity=".7"/><path d="M50 50 L42 100 L58 100Z" fill="${c.c1}" opacity=".7"/><ellipse cx="50" cy="50" rx="32" ry="9" fill="${c.c2}" opacity=".6"/><circle cx="50" cy="50" r="12" fill="url(#${u}s)"/><circle cx="50" cy="50" r="6" fill="#fff"/>`;
      break;
    case 'cmb':
      s += `<ellipse cx="50" cy="50" rx="44" ry="28" fill="${c.c2}"/>`;
      for (let i=0;i<40;i++){ const x=50+Math.cos(i*2.1)*(i%7)*6, y=50+Math.sin(i*1.3)*(i%5)*5; s+=`<circle cx="${x}" cy="${y}" r="${3+(i%4)}" fill="${c.c1}" opacity=".55"/>`; }
      s += `<ellipse cx="50" cy="50" rx="44" ry="28" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6"/>`;
      break;
    case 'bigbang':
      s += `<circle cx="50" cy="50" r="48" fill="url(#${u}s)"/>`;
      for (let i=0;i<24;i++){ const a=i/24*6.283, r=20+(i%3)*10; s+=`<path d="M50 50 L${50+Math.cos(a)*r*1.4} ${50+Math.sin(a)*r*1.4}" stroke="${['#FFC83D','#FF6B4A','#B26BFF','#4C9DFF'][i%4]}" stroke-width="2.5" stroke-linecap="round"/>`; }
      s += `<circle cx="50" cy="50" r="10" fill="#fff"/>`;
      break;
  }
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${defs}${s}</svg>`;
}

// ---------- 화면 ----------
function render(){
  const total = CARDS.length;
  document.getElementById('totalN').textContent = total;
  document.getElementById('foundN').textContent = S.found.length;
  document.getElementById('chargeN').textContent = S.charges;
  document.getElementById('charges').innerHTML = Array.from({length:MAX},(_,i)=>`<i class="${i<S.charges?'on':''}"></i>`).join('');
  document.getElementById('rate').textContent = `${S.found.length} / ${total} (${Math.round(S.found.length/total*100)}%)`;
  document.getElementById('rateBar').style.width = (S.found.length/total*100)+'%';
  document.getElementById('dex').innerHTML = TIERS.map((t,ti)=>`<div class="tierH"><i style="background:${t.color}"></i>${t.name}</div><div class="grid">${
    CARDS.filter(c=>c.tier===ti).map(c=>{
      const got = S.found.includes(c.id);
      return got ? `<div class="slot" style="border-color:${t.color}" data-id="${c.id}">${art(c,60)}<small>${c.name}</small><em>×${S.inv[c.id]||0}</em></div>`
                 : `<div class="slot unknown"><b>?</b><small>${c.id===HIDDEN?'???':'미발견'}</small></div>`;
    }).join('')}</div>`).join('');
  document.querySelectorAll('.slot[data-id]').forEach(el => el.onclick = () => show(byId[el.dataset.id], false));
  document.getElementById('fuse').innerHTML = TIERS.map((t,ti)=>{
    const n = tierCount(ti); const to = ti < 4 ? TIERS[ti+1].name : '???';
    return `<div class="fuse"><div class="dot" style="background:${t.color}">${t.name[0]}</div>
      <div><b>${t.name} 3장 → ${to} 1장</b><span>가진 ${t.name} 카드 ${n}장</span></div>
      <button data-t="${ti}" ${n<3?'disabled':''}>융합하기</button></div>`;
  }).join('');
  document.querySelectorAll('.fuse button').forEach(b => b.onclick = () => fuse(+b.dataset.t));
}
const tierCount = ti => CARDS.filter(c=>c.tier===ti).reduce((a,c)=>a+(S.inv[c.id]||0),0);

function show(c, isNew){
  const t = TIERS[c.tier];
  document.getElementById('rcard').innerHTML = `<div class="rcard" style="border-color:${t.color}">
    <span class="tag" style="background:${t.color}">${t.name}</span>${isNew?'<span class="tag new">NEW</span>':''}
    ${art(c,150)}<b>${c.name}</b><p>${c.desc}</p></div>`;
  const r = document.getElementById('reveal');
  r.classList.toggle('legend', c.tier===4); r.classList.add('on');
}
document.getElementById('ok').onclick = () => document.getElementById('reveal').classList.remove('on');
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1600); }

function gain(c){
  const isNew = !S.found.includes(c.id);
  if (isNew) S.found.push(c.id);
  S.inv[c.id] = (S.inv[c.id]||0) + 1;
  save(); render(); show(c, isNew);
  if (c.tier >= 3 && navigator.vibrate) navigator.vibrate([80,60,160]);
}
function pickTier(){ let r=Math.random()*100; for (let i=0;i<TIERS.length;i++){ if ((r-=TIERS[i].p) < 0) return i; } return 0; }
function randomOf(ti){ const pool = CARDS.filter(c=>c.tier===ti && c.id!==HIDDEN); return pool[Math.floor(Math.random()*pool.length)]; }

// ---------- 관측(뽑기) ----------
function observe(){
  if (document.getElementById('reveal').classList.contains('on')) return;
  if (S.charges <= 0){ toast('관측 횟수가 없어요. 엔진을 돌려 충전하세요!'); return; }
  S.charges--;
  const p = document.getElementById('portal'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
  setTimeout(()=>gain(randomOf(pickTier())), 380);
}
// 터치 관측: 켜져 있을 때만 화면을 눌러 관측
let touchOn = false, shakeOn = false;
document.getElementById('portal').onclick = () => {
  if (!touchOn){ toast('터치 관측이 꺼져 있어요. 흔들어서 관측해요!'); return; }
  observe();
};
function setToggles(){
  document.getElementById('touchTog').classList.toggle('on', touchOn);
  document.getElementById('shakeTog').classList.toggle('on', shakeOn);
  document.getElementById('shakeTog').lastChild.textContent = shakeOn ? '흔들기 켜짐' : '흔들기 켜기';
  document.getElementById('hint').textContent = touchOn ? '또는 여기를 눌러요' : (shakeOn ? '폰을 흔들어 보세요' : '오른쪽 아래에서 흔들기를 켜요');
}
document.getElementById('touchTog').onclick = () => { touchOn = !touchOn; setToggles(); };

// 흔들기: 가속도 변화가 크면 관측
let lastShake = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity; if (!a) return;
  const m = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
  if (m > 24 && Date.now() - lastShake > 1200){ lastShake = Date.now(); observe(); }
}
document.getElementById('shakeTog').onclick = async () => {
  if (shakeOn){ shakeOn = false; window.removeEventListener('devicemotion', onMotion); setToggles(); return; }
  // 아이폰은 버튼을 눌렀을 때 권한을 받아야 해요
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    try { if (await DeviceMotionEvent.requestPermission() !== 'granted'){ toast('허용되지 않았어요'); return; } }
    catch(e){ toast('허용되지 않았어요'); return; }
  }
  window.addEventListener('devicemotion', onMotion);
  shakeOn = true; setToggles(); toast('이제 흔들어서 관측할 수 있어요');
};
setToggles();

// ---------- 로켓 엔진(충전) ----------
const TAP = 5;          // 한 번 누를 때 오르는 양 (%)
const DECAY = 12;       // 1초에 줄어드는 양 (%)
let gauge = 0;
document.getElementById('engBtn').onclick = () => {
  if (S.charges >= MAX){ toast('관측 횟수가 가득 찼어요'); return; }
  gauge += TAP;
  if (gauge >= 100){ gauge = 0; S.charges++; save(); render(); toast('관측 1회 충전!'); }
  document.getElementById('gauge').style.width = gauge + '%';
};
setInterval(() => { if (gauge > 0){ gauge = Math.max(0, gauge - DECAY/20); document.getElementById('gauge').style.width = gauge + '%'; } }, 50);

// ---------- 융합 ----------
function fuse(ti){
  if (tierCount(ti) < 3) return;
  let need = 3;
  const own = CARDS.filter(c=>c.tier===ti && S.inv[c.id]).sort((a,b)=>S.inv[b.id]-S.inv[a.id]);
  while (need > 0){ for (const c of own){ if (need>0 && S.inv[c.id]>0){ S.inv[c.id]--; need--; } } }
  const result = ti === 4 ? byId[HIDDEN] : randomOf(ti+1);
  gain(result);
}

// ---------- 탭 ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id==='tab-'+b.dataset.t));
  document.getElementById('corner').classList.toggle('on', b.dataset.t==='obs');
});

// 배경 별
const sky = document.getElementById('sky');
for (let i=0;i<70;i++){ const st=document.createElement('i'); st.style.left=Math.random()*100+'%'; st.style.top=Math.random()*100+'%'; st.style.animationDelay=(Math.random()*3)+'s'; st.style.opacity=Math.random(); sky.appendChild(st); }
render();
</script>
</body>
</html>
